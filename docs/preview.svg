<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="Resource Radar workbench: left navigation entry, channel tabs with counts, status chip, filter bar, and AI-graded entry cards with quality stars and favorites">
